# tw-update-guard – all options with their defaults (/etc/twguard/config.default.toml).
# This file is only a reference and is replaced by every update. Your settings belong in
# /etc/twguard/config.toml (mode 0600, contains the bot token), and only those that differ.

[telegram]
# Token from @BotFather; one bot per server
token = "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
# Group (negative ID) or private chat; find it with: twguard telegram-ids
chat_id = -1001234567890
# Who may give commands (Telegram user IDs)
allowed_user_ids = [123456789]
# /help sent to all servers: only the bot with true answers (with the full command list), the
# others stay silent. Set to true in exactly one configuration.
help_full = false
# Single fetch and send errors are normal and do not appear in the journal. A warning is logged
# only above this many per hour (at about 360 fetches per hour). 0 = never
max_errors_per_hour = 10

[general]
# hostname = "server1"        # default: the machine name
# "observe": only check and report, install nothing (default, to start with)
# "auto": install routine updates automatically
mode = "observe"
# Language of Telegram messages, command line and log: "en" (default) or "de"
language = "en"
# Additional arguments for zypper dup, e.g. ["--no-recommends"]
dup_args = []
# Silent message after each automatic update
report_routine = true

[rules]
# Every change needs approval (boot loader, network, SSH: risk of lockout)
block = ["grub2", "grub2-*", "shim", "systemd-boot", "dracut",
         "openssh-server*", "wicked*", "NetworkManager", "systemd-network", "firewalld"]
# Approval on a version jump and for new or removed packages matching a pattern.
# "pattern:2" compares the first two version parts (PHP 8.4 → 8.5), otherwise only the first.
# Patterns without a match on the server do no harm.
watch = [
    # Base
    "systemd", "glibc", "openssl", "mdadm", "python3[0-9][0-9]",
    # Web and databases
    "apache2", "php8*:2", "mariadb:2", "redis", "postgresql*", "nginx", "nextcloud",
    "roundcubemail:2", "forgejo",
    # Mail and DNS
    "postfix", "dovecot*:2", "amavisd-new", "spamassassin", "clamav:2", "bind:2",
    # Other services
    "bareos-filedaemon", "samba:2", "docker", "containerd", "podman", "syncthing",
    "snapd", "fail2ban:2",
]
# For information only: these require a reboot
reboot = ["kernel-default", "kernel-longterm"]
# Removals that are normal on Tumbleweed
routine_removals = ["lib*", "*-lang", "typelib-*"]
max_removals = 20
# 0 = no limit (large rebuilds are normal on Tumbleweed)
max_packages = 0

[escalation]
# No reminders during this period (local time); "" = always remind
quiet_hours = "22:00-07:00"
# Steps [from age in hours, interval in hours]:
# right away, then daily; after 2 days every 8 h; after 5 days every 3 h; after 10 days hourly
ladder = [[0, 24], [48, 8], [120, 3], [240, 1]]
# Report temporary errors (repository unreachable) only after a day
ladder_error = [[24, 24], [72, 6]]
# /later: how often and for how long at most
max_snoozes = 2
max_snooze_hours = 72
# Alert if no check has succeeded for this long
stale_after_hours = 72

[briefing]
# Daily summary per server, also when all is well (sign of life).
# Time up to 18:00; if the bot was off at that time, it comes up to 6 hours later. "" = off
at = "08:00"
# Silent as long as nothing is open
silent = true

[update]
# Git working copy of tw-update-guard on this server; /update fetches the new
# version from there (git fetch). Empty = disabled. install.sh enters the path itself.
# repo = "/root/tw-update-guard"
branch = "main"
